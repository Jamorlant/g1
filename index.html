<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创意飞行棋 - 剪刀石头布对战</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0e27;
      --bg-card: #141832;
      --neon-cyan: #00f5ff;
      --neon-purple: #b829dd;
      --neon-pink: #ff2d95;
      --neon-yellow: #ffea00;
      --gold: #ffd700;
      --text-primary: #ffffff;
      --text-secondary: #a0a8d0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-primary);
    }

    /* 粒子背景 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(184, 41, 221, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 45, 149, 0.08) 0%, transparent 60%);
    }

    .particles::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20px 30px, var(--neon-cyan), transparent),
        radial-gradient(2px 2px at 40px 70px, var(--neon-purple), transparent),
        radial-gradient(2px 2px at 50px 160px, var(--neon-pink), transparent),
        radial-gradient(2px 2px at 90px 40px, var(--neon-yellow), transparent),
        radial-gradient(2px 2px at 130px 80px, var(--neon-cyan), transparent);
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: drift 60s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-200px); }
    }

    /* 主容器 */
    .game-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 视图切换 */
    .view {
      display: none;
      width: 100%;
      max-width: 1200px;
      animation: fadeIn 0.5s ease;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 开始菜单 ========== */
    #menu-view {
      text-align: center;
      gap: 40px;
    }

    .game-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 60px rgba(0, 245, 255, 0.5);
      animation: titleGlow 3s ease-in-out infinite alternate;
      position: relative;
    }

    .game-title::after {
      content: '创意飞行棋';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(20px);
      opacity: 0.7;
      z-index: -1;
    }

    @keyframes titleGlow {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.3); }
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      letter-spacing: 4px;
      margin-top: 10px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      padding: 18px 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      color: white;
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(0, 245, 255, 0.6);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--neon-purple);
      color: var(--neon-purple);
    }

    .btn-secondary:hover {
      background: rgba(184, 41, 221, 0.2);
    }

    /* ========== 英雄选择 ========== */
    #hero-view {
      gap: 30px;
    }

    .view-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
    }

    .player-selectors {
      display: flex;
      gap: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .player-selector {
      text-align: center;
    }

    .player-label {
      font-size: 1.5rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-family: 'Orbitron', sans-serif;
    }

    .hero-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .hero-card {
      width: 140px;
      height: 180px;
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hero-card:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
    }

    .hero-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }

    .hero-card.locked {
      opacity: 0.5;
      pointer-events: none;
    }

    .hero-icon {
      font-size: 3rem;
    }

    .hero-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .hero-skill {
      font-size: 0.75rem;
      color: var(--neon-pink);
    }

    .confirm-btn {
      margin-top: 30px;
    }

    /* ========== 游戏主界面 ========== */
    #game-view {
      gap: 20px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 20px;
    }

    .player-status {
      background: var(--bg-card);
      padding: 15px 25px;
      border-radius: 12px;
      min-width: 200px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .player-status.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
    }

    .player-status.player1 {
      border-left: 4px solid var(--neon-cyan);
    }

    .player-status.player2 {
      border-right: 4px solid var(--neon-pink);
    }

    .status-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .status-hero {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .energy-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .energy-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
      transition: width 0.5s ease;
      border-radius: 4px;
    }

    .energy-text {
      font-size: 0.8rem;
      color: var(--neon-yellow);
    }

    .skill-btn {
      background: linear-gradient(135deg, var(--neon-pink), var(--gold));
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      opacity: 0.3;
      transition: all 0.3s ease;
    }

    .skill-btn.ready {
      opacity: 1;
      animation: skillPulse 1s infinite;
    }

    .skill-btn:hover {
      transform: scale(1.05);
    }

    @keyframes skillPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 45, 149, 0.5); }
      50% { box-shadow: 0 0 30px rgba(255, 45, 149, 0.8); }
    }

    /* 3D螺旋棋盘 */
    .board-wrapper {
      perspective: 1200px;
      width: 100%;
      max-width: 700px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-container {
      position: relative;
      width: 500px;
      height: 400px;
      transform-style: preserve-3d;
      transform: rotateX(60deg) rotateZ(-30deg);
    }

    .board-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      transform-style: preserve-3d;
    }

    .cell {
      width: 60px;
      height: 60px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      position: relative;
      transition: all 0.3s ease;
    }

    .cell.start {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border-color: var(--neon-cyan);
    }

    .cell.star { background: rgba(255, 234, 0, 0.2); border-color: var(--gold); }
    .cell.lightning { background: rgba(0, 245, 255, 0.2); border-color: var(--neon-cyan); }
    .cell.wing { background: rgba(184, 41, 221, 0.2); border-color: var(--neon-purple); }
    .cell.treasure { background: rgba(255, 45, 149, 0.2); border-color: var(--neon-pink); }

    .cell.highlight {
      animation: cellPulse 0.5s ease;
    }

    @keyframes cellPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); box-shadow: 0 0 20px var(--neon-yellow); }
    }

    /* 棋子 */
    .piece {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .piece.player1 {
      background: linear-gradient(135deg, var(--neon-cyan), #0088aa);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .piece.player2 {
      background: linear-gradient(135deg, var(--neon-pink), #aa0044);
      box-shadow: 0 0 15px var(--neon-pink);
    }

    /* 控制区域 */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: var(--bg-card);
      border-radius: 16px;
      border: 2px solid rgba(0, 245, 255, 0.2);
    }

    .rps-buttons {
      display: flex;
      gap: 20px;
    }

    .rps-btn {
      width: 100px;
      height: 100px;
      border: 3px solid transparent;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      font-size: 3rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rps-btn:hover {
      border-color: var(--neon-cyan);
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
    }

    .rps-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .turn-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-yellow);
    }

    .game-log {
      max-width: 500px;
      max-height: 100px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    .log-entry {
      padding: 4px;
      animation: logFade 0.3s ease;
    }

    .log-entry.win { color: var(--neon-cyan); }
    .log-entry.lose { color: var(--neon-pink); }
    .log-entry.draw { color: var(--gold); }
    .log-entry.skill { color: var(--neon-purple); }
    .log-entry.special { color: var(--neon-yellow); }

    @keyframes logFade {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 回合结果展示 */
    .round-result {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      padding: 30px 60px;
      border-radius: 20px;
      z-index: 100;
      animation: resultPop 1.5s ease forwards;
      pointer-events: none;
    }

    .round-result.win {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.9), rgba(0, 136, 170, 0.9));
      box-shadow: 0 0 60px var(--neon-cyan);
    }

    .round-result.lose {
      background: linear-gradient(135deg, rgba(255, 45, 149, 0.9), rgba(170, 0, 68, 0.9));
      box-shadow: 0 0 60px var(--neon-pink);
    }

    .round-result.draw {
      background: linear-gradient(135deg, rgba(255, 234, 0, 0.9), rgba(170, 136, 0, 0.9));
      box-shadow: 0 0 60px var(--gold);
      color: #000;
    }

    @keyframes resultPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      40% { transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }

    /* ========== 结算页面 ========== */
    #result-view {
      text-align: center;
      gap: 30px;
    }

    .result-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      animation: resultGlow 2s ease-in-out infinite alternate;
    }

    .result-title.victory {
      background: linear-gradient(135deg, var(--gold), var(--neon-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .result-title.defeat {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes resultGlow {
      0% { filter: brightness(1) drop-shadow(0 0 20px currentColor); }
      100% { filter: brightness(1.5) drop-shadow(0 0 40px currentColor); }
    }

    .result-subtitle {
      font-size: 1.5rem;
      color: var(--text-secondary);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .game-header {
        flex-direction: column;
        gap: 15px;
      }

      .player-status {
        width: 100%;
      }

      .board-wrapper {
        height: 350px;
      }

      .board-container {
        transform: rotateX(60deg) rotateZ(-30deg) scale(0.8);
      }

      .rps-btn {
        width: 80px;
        height: 80px;
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="particles"></div>

  <div class="game-container">
    <!-- 开始菜单 -->
    <div id="menu-view" class="view active">
      <div>
        <h1 class="game-title">创意飞行棋</h1>
        <p class="subtitle">ROCK PAPER SCISSORS</p>
      </div>
      <div class="menu-buttons">
        <button class="btn btn-primary" onclick="startGame()">开始对战</button>
        <button class="btn btn-secondary" onclick="showRules()">游戏规则</button>
      </div>
    </div>

    <!-- 英雄选择 -->
    <div id="hero-view" class="view">
      <h2 class="view-title">选择你的英雄</h2>
      <div class="player-selectors">
        <div class="player-selector">
          <div class="player-label">玩家 1</div>
          <div class="hero-cards" id="player1-heroes"></div>
        </div>
        <div class="player-selector">
          <div class="player-label">玩家 2</div>
          <div class="hero-cards" id="player2-heroes"></div>
        </div>
      </div>
      <button class="btn btn-primary confirm-btn" onclick="confirmHeroes()">确认选择</button>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-view" class="view">
      <div class="game-header">
        <div class="player-status player1" id="player1-status">
          <div class="status-name">玩家 1</div>
          <div class="status-hero" id="p1-hero">烈焰</div>
          <div class="energy-bar"><div class="energy-fill" id="p1-energy" style="width: 0%"></div></div>
          <div class="energy-text">能量: <span id="p1-energy-text">0</span>/100</div>
          <button class="skill-btn" id="p1-skill" onclick="useSkill(1)">烈焰冲击</button>
        </div>
        <div class="turn-indicator" id="turn-indicator">玩家 1 的回合</div>
        <div class="player-status player2" id="player2-status">
          <div class="status-name">玩家 2</div>
          <div class="status-hero" id="p2-hero">寒霜</div>
          <div class="energy-bar"><div class="energy-fill" id="p2-energy" style="width: 0%"></div></div>
          <div class="energy-text">能量: <span id="p2-energy-text">0</span>/100</div>
          <button class="skill-btn" id="p2-skill" onclick="useSkill(2)">冰封领域</button>
        </div>
      </div>

      <div class="board-wrapper">
        <div class="board-container" id="board"></div>
      </div>

      <div class="controls">
        <div class="turn-indicator" id="action-prompt">选择你的出拳</div>
        <div class="rps-buttons">
          <button class="rps-btn" onclick="playRound('rock')" id="btn-rock">石头</button>
          <button class="rps-btn" onclick="playRound('scissors')" id="btn-scissors">剪刀</button>
          <button class="rps-btn" onclick="playRound('paper')" id="btn-paper">布</button>
        </div>
        <div class="game-log" id="game-log"></div>
      </div>
    </div>

    <!-- 结算界面 -->
    <div id="result-view" class="view">
      <h1 class="result-title" id="result-title">胜利</h1>
      <p class="result-subtitle" id="result-subtitle">恭喜你获得胜利！</p>
      <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
      <button class="btn btn-secondary" onclick="backToMenu()">返回主菜单</button>
    </div>
  </div>

  <script>
    // ============ 游戏数据 ============
    const HEROES = [
      { id: 'flame', name: '烈焰', icon: '🔥', skill: '烈焰冲击', skillDesc: '强制前进8步', effect: 'advance', value: 8 },
      { id: 'frost', name: '寒霜', icon: '❄️', skill: '冰封领域', skillDesc: '对手暂停1回合', effect: 'stun', value: 1 },
      { id: 'wind', name: '疾风', icon: '💨', skill: '瞬影步', skillDesc: '立即移动3步', effect: 'advance', value: 3 },
      { id: 'earth', name: '大地', icon: '🪨', skill: '地动山摇', skillDesc: '对手击退5步', effect: 'retreat', value: 5 }
    ];

    const BOARD_SIZE = 60;
    const BOARD_TYPES = ['normal', 'star', 'lightning', 'wing', 'treasure'];
    const CELL_EFFECTS = {
      star: { emoji: '⭐', text: '星星格: 额外前进2步!' },
      lightning: { emoji: '⚡', text: '闪电格: 交换位置!' },
      wing: { emoji: '🪄', text: '翅膀格: 跃飞3步!' },
      treasure: { emoji: '💎', text: '宝箱格: 能量+25!' }
    };

    // ============ 游戏状态 ============
    let gameState = {
      phase: 'MENU', // MENU, HERO_SELECT, PLAYING, ROUND_RESULT, GAME_OVER
      currentPlayer: 1,
      selectedHeroes: [null, null],
      players: [
        { id: 1, hero: null, energy: 0, pieces: [0, 0, 0, 0], isStunned: false, skillUsed: false },
        { id: 2, hero: null, energy: 0, pieces: [0, 0, 0, 0], isStunned: false, skillUsed: false }
      ],
      winner: null
    };

    // ============ 初始化 ============
    function init() {
      renderHeroCards();
    }

    function renderHeroCards() {
      const container1 = document.getElementById('player1-heroes');
      const container2 = document.getElementById('player2-heroes');

      HEROES.forEach((hero, idx) => {
        container1.innerHTML += createHeroCard(hero, 1, idx);
        container2.innerHTML += createHeroCard(hero, 2, idx);
      });
    }

    function createHeroCard(hero, player, idx) {
      return `
        <div class="hero-card" onclick="selectHero(${player}, ${idx})" id="hero-${player}-${idx}">
          <div class="hero-icon">${hero.icon}</div>
          <div class="hero-name">${hero.name}</div>
          <div class="hero-skill">${hero.skill}</div>
        </div>
      `;
    }

    // ============ 界面切换 ============
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // ============ 游戏流程 ============
    function startGame() {
      gameState.phase = 'HERO_SELECT';
      gameState.selectedHeroes = [null, null];
      showView('hero-view');
    }

    function selectHero(player, heroIdx) {
      const hero = HEROES[heroIdx];
      const container = player === 1 ?
        document.getElementById('player1-heroes') :
        document.getElementById('player2-heroes');

      // 移除其他卡片的选中状态
      container.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
      document.getElementById(`hero-${player}-${heroIdx}`).classList.add('selected');

      gameState.selectedHeroes[player - 1] = heroIdx;
    }

    function confirmHeroes() {
      if (gameState.selectedHeroes[0] === null || gameState.selectedHeroes[1] === null) {
        alert('请两位玩家各选择一个英雄！');
        return;
      }

      // 初始化玩家数据
      gameState.players[0].hero = HEROES[gameState.selectedHeroes[0]];
      gameState.players[1].hero = HEROES[gameState.selectedHeroes[1]];
      gameState.players[0].energy = 0;
      gameState.players[1].energy = 0;
      gameState.players[0].pieces = [0, 0, 0, 0];
      gameState.players[1].pieces = [0, 0, 0, 0];
      gameState.players[0].isStunned = false;
      gameState.players[1].isStunned = false;
      gameState.currentPlayer = 1;
      gameState.winner = null;

      // 更新UI
      document.getElementById('p1-hero').textContent = gameState.players[0].hero.name;
      document.getElementById('p2-hero').textContent = gameState.players[1].hero.name;
      document.getElementById('p1-skill').textContent = gameState.players[0].hero.skill;
      document.getElementById('p2-skill').textContent = gameState.players[1].hero.skill;

      // 生成棋盘
      generateBoard();

      // 更新状态
      updateStatus();
      showView('game-view');
      gameState.phase = 'PLAYING';

      addLog('游戏开始！', 'special');
      addLog(`${gameState.players[0].hero.icon} ${gameState.players[0].hero.name} vs ${gameState.players[1].hero.icon} ${gameState.players[1].hero.name}`, 'special');
    }

    function generateBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      for (let i = 0; i < BOARD_SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${i}`;

        // 设置位置 - 螺旋布局
        const row = Math.floor(i / 6);
        const col = i % 6;
        const layer = Math.floor(row / 5) + 1;
        const layerOffset = (layer - 1) * 100;

        cell.style.position = 'absolute';
        cell.style.left = `${col * 70 + 20}px`;
        cell.style.top = `${row * 65 + 10}px`;
        cell.style.transform = `translateZ(${layer * 30}px)`;

        // 设置特殊格子
        if (i === 0) {
          cell.classList.add('start');
          cell.textContent = '🏠';
        } else if (i === BOARD_SIZE - 1) {
          cell.classList.add('star');
          cell.textContent = '🏆';
        } else {
          const type = BOARD_TYPES[Math.floor(Math.random() * BOARD_TYPES.length)];
          if (type !== 'normal') {
            cell.classList.add(type);
            cell.textContent = CELL_EFFECTS[type].emoji;
          }
        }

        board.appendChild(cell);
      }

      // 添加棋子
      for (let p = 0; p < 2; p++) {
        for (let piece = 0; piece < 4; piece++) {
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece player${p + 1}`;
          pieceEl.id = `piece-${p}-${piece}`;
          pieceEl.textContent = piece + 1;
          board.appendChild(pieceEl);
        }
      }

      updatePiecePositions();
    }

    function updatePiecePositions() {
      for (let p = 0; p < 2; p++) {
        for (let piece = 0; piece < 4; piece++) {
          const pos = gameState.players[p].pieces[piece];
          const pieceEl = document.getElementById(`piece-${p}-${piece}`);
          const cell = document.getElementById(`cell-${pos}`);

          if (cell && pieceEl) {
            const rect = cell.getBoundingClientRect();
            const boardRect = document.getElementById('board').getBoundingClientRect();

            pieceEl.style.left = `${parseFloat(cell.style.left) + 18 + (piece % 2) * 15}px`;
            pieceEl.style.top = `${parseFloat(cell.style.top) + 18 + Math.floor(piece / 2) * 15}px`;
            pieceEl.style.transform = cell.style.transform;
          }
        }
      }
    }

    function updateStatus() {
      const p1 = gameState.players[0];
      const p2 = gameState.players[1];

      document.getElementById('p1-energy').style.width = `${p1.energy}%`;
      document.getElementById('p1-energy-text').textContent = p1.energy;
      document.getElementById('p2-energy').style.width = `${p2.energy}%`;
      document.getElementById('p2-energy-text').textContent = p2.energy;

      // 技能按钮状态
      document.getElementById('p1-skill').classList.toggle('ready', p1.energy >= 100);
      document.getElementById('p2-skill').classList.toggle('ready', p2.energy >= 100);

      // 当前玩家高亮
      document.getElementById('player1-status').classList.toggle('active', gameState.currentPlayer === 1);
      document.getElementById('player2-status').classList.toggle('active', gameState.currentPlayer === 2);

      document.getElementById('turn-indicator').textContent = `玩家 ${gameState.currentPlayer} 的回合`;
    }

    // ============ 回合逻辑 ============
    function playRound(playerChoice) {
      if (gameState.phase !== 'PLAYING') return;

      const currentP = gameState.currentPlayer;
      const opponent = currentP === 1 ? 2 : 1;

      // 检查是否被冰封
      if (gameState.players[currentP - 1].isStunned) {
        addLog(`玩家 ${currentP} 被冰封，跳过回合！`, 'special');
        gameState.players[currentP - 1].isStunned = false;
        switchPlayer();
        return;
      }

      // 禁用按钮
      document.querySelectorAll('.rps-btn').forEach(b => b.classList.add('disabled'));

      // AI选择
      const choices = ['rock', 'scissors', 'paper'];
      const aiChoice = choices[Math.floor(Math.random() * 3)];

      // 判断胜负
      const result = getRPSResult(playerChoice, aiChoice);

      // 显示结果
      showRoundResult(result, playerChoice, aiChoice);

      // 应用结果
      setTimeout(() => {
        applyRoundResult(currentP, result, playerChoice);

        // 检查胜利
        if (checkWin(currentP)) {
          gameState.winner = currentP;
          gameState.phase = 'GAME_OVER';
          showResult();
          return;
        }

        // 切换玩家
        switchPlayer();
        document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('disabled'));
      }, 1500);
    }

    function getRPSResult(p1, p2) {
      // 0: 平局, 1: p1赢, -1: p1输
      if (p1 === p2) return 0;
      if (
        (p1 === 'rock' && p2 === 'scissors') ||
        (p1 === 'scissors' && p2 === 'paper') ||
        (p1 === 'paper' && p2 === 'rock')
      ) return 1;
      return -1;
    }

    function getChoiceText(choice) {
      return { rock: '石头', scissors: '剪刀', paper: '布' }[choice];
    }

    function showRoundResult(result, playerChoice, aiChoice) {
      const resultEl = document.createElement('div');
      resultEl.className = `round-result ${result === 1 ? 'win' : result === -1 ? 'lose' : 'draw'}`;

      const choiceText = {
        rock: '✊',
        scissors: '✌️',
        paper: '✋'
      };

      resultEl.innerHTML = `
        <div>${choiceText[playerChoice]} vs ${choiceText[aiChoice]}</div>
        <div style="font-size: 1.5rem; margin-top: 10px;">
          ${result === 1 ? '胜！' : result === -1 ? '负！' : '平局！'}
        </div>
      `;

      document.body.appendChild(resultEl);
      setTimeout(() => resultEl.remove(), 1500);
    }

    function applyRoundResult(player, result, choice) {
      const currentP = gameState.players[player - 1];
      const moveInfo = { rock: { win: 0, lose: -2 }, scissors: { win: 2, lose: -3 }, paper: { win: 5, lose: -1 } };

      let move = 0;
      let energyGain = 0;

      if (result === 1) {
        move = moveInfo[choice].win;
        if (choice === 'rock') energyGain = 15;
        addLog(`玩家 ${player} 出${getChoiceText(choice)}获胜，前进${move}步${energyGain > 0 ? '，能量+15' : ''}！`, 'win');
      } else if (result === -1) {
        move = moveInfo[choice].lose;
        addLog(`玩家 ${player} 出${getChoiceText(choice)}落败，后退${Math.abs(move)}步！`, 'lose');
      } else {
        addLog(`平局！双方各退1步`, 'draw');
        move = -1;
      }

      // 移动棋子
      movePiece(player, move);

      // 能量
      if (energyGain > 0) {
        currentP.energy = Math.min(100, currentP.energy + energyGain);
      }

      // 重置技能使用标记
      currentP.skillUsed = false;

      updateStatus();
    }

    function movePiece(player, steps) {
      const currentP = gameState.players[player - 1];

      // 找到最前面的棋子移动
      let moved = false;
      for (let i = 0; i < 4; i++) {
        const newPos = currentP.pieces[i] + steps;
        if (steps >= 0 || currentP.pieces[i] > 0) {
          currentP.pieces[i] = Math.max(0, Math.min(BOARD_SIZE - 1, newPos));
          moved = true;

          // 检查特殊格子效果
          checkCellEffect(player, i);
          break;
        }
      }

      updatePiecePositions();
    }

    function checkCellEffect(player, pieceIdx) {
      const pos = gameState.players[player - 1].pieces[pieceIdx];
      const cell = document.getElementById(`cell-${pos}`);

      if (!cell) return;

      const opponent = player === 1 ? 2 : 1;

      if (cell.classList.contains('star')) {
        gameState.players[player - 1].pieces[pieceIdx] = Math.min(BOARD_SIZE - 1, pos + 2);
        addLog(`⭐ 触发星星格！额外前进2步`, 'special');
      } else if (cell.classList.contains('lightning')) {
        // 交换位置
        const oppPieces = gameState.players[opponent - 1].pieces;
        for (let i = 0; i < 4; i++) {
          if (oppPieces[i] === pos) {
            gameState.players[opponent - 1].pieces[i] = gameState.players[player - 1].pieces[pieceIdx];
            break;
          }
        }
        addLog(`⚡ 触发闪电格！与对手交换位置`, 'special');
        updatePiecePositions();
      } else if (cell.classList.contains('wing')) {
        gameState.players[player - 1].pieces[pieceIdx] = Math.min(BOARD_SIZE - 1, pos + 3);
        addLog(`🪄 触发翅膀格！跃飞3步`, 'special');
      } else if (cell.classList.contains('treasure')) {
        const energyGain = 25;
        gameState.players[player - 1].energy = Math.min(100, gameState.players[player - 1].energy + energyGain);
        addLog(`💎 触发宝箱格！能量+25`, 'special');
      }

      cell.classList.add('highlight');
      setTimeout(() => cell.classList.remove('highlight'), 500);
      updatePiecePositions();
    }

    function switchPlayer() {
      gameState.currentPlayer = gameState.currentPlayer === 1 ? 2 : 1;

      // 检查被冰封
      if (gameState.players[gameState.currentPlayer - 1].isStunned) {
        addLog(`玩家 ${gameState.currentPlayer} 被冰封！`, 'special');
        gameState.players[gameState.currentPlayer - 1].isStunned = false;
        gameState.currentPlayer = gameState.currentPlayer === 1 ? 2 : 1;
      }

      updateStatus();
    }

    function useSkill(playerId) {
      const player = gameState.players[playerId - 1];
      const hero = player.hero;

      if (player.energy < 100 || player.skillUsed) {
        return;
      }

      player.skillUsed = true;
      player.energy = 0;

      const opponent = playerId === 1 ? 2 : 1;

      addLog(`${hero.icon} ${hero.name} 释放 ${hero.skill}！`, 'skill');

      if (hero.effect === 'advance') {
        movePiece(playerId, hero.value);
      } else if (hero.effect === 'stun') {
        gameState.players[opponent - 1].isStunned = true;
        addLog(`对手被冰封，下回合无法行动！`, 'special');
      } else if (hero.effect === 'retreat') {
        movePiece(opponent, -hero.value);
      }

      updateStatus();
    }

    function checkWin(player) {
      return gameState.players[player - 1].pieces.every(pos => pos >= BOARD_SIZE - 1);
    }

    function showResult() {
      const title = document.getElementById('result-title');
      const subtitle = document.getElementById('result-subtitle');

      if (gameState.winner) {
        title.textContent = '胜利！';
        title.className = 'result-title victory';
        subtitle.textContent = `玩家 ${gameState.winner} 获得最终胜利！`;
      } else {
        title.textContent = '失败';
        title.className = 'result-title defeat';
        subtitle.textContent = '再接再厉！';
      }

      showView('result-view');
    }

    function addLog(message, type = '') {
      const log = document.getElementById('game-log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = message;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function restartGame() {
      gameState.phase = 'HERO_SELECT';
      gameState.selectedHeroes = [null, null];
      document.getElementById('game-log').innerHTML = '';
      showView('hero-view');
    }

    function backToMenu() {
      gameState.phase = 'MENU';
      document.getElementById('game-log').innerHTML = '';
      showView('menu-view');
    }

    function showRules() {
      alert(`
🎮 创意飞行棋 - 游戏规则

【基础规则】
• 两位玩家轮流对战，轮流选择石头/剪刀/布
• 胜负决定移动步数：
  ✊ 石头获胜：前进0步 + 蓄能+15
  ✌️ 剪刀获胜：前进2步
  ✋ 布  获胜：前进5步
  失败：后退对应步数
  平局：各退1步

【能量与技能】
• 每次出石头获胜获得15点能量
• 能量满100时，可释放英雄终极技能
• 每个英雄技能不同效果！

【英雄技能】
🔥 烈焰 - 强制前进8步
❄️ 寒霜 - 对手暂停1回合
💨 疾风 - 立即移动3步
🪨 大地 - 对手击退5步

【特殊格子】
⭐ 星星格：额外前进2步
⚡ 闪电格：交换位置
🪄 翅膀格：跃飞3步
💎 宝箱格：能量+25

【胜利条件】
首先将全部4枚棋子移入终点（第60格）的玩家获胜！
      `);
    }

    // 启动
    init();
  </script>
</body>
